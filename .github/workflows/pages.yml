# Baut die Web-Version (Rust-Engine als WebAssembly + React) und veroeffentlicht sie auf GitHub Pages.
# Einmalig im Repo aktivieren: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Rust-Toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown

      - name: Cargo-Cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: npm-Abhaengigkeiten
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Engine-Tests
        run: cargo test -p life-engine --no-default-features

      - name: Web-Build (WASM + Vite)
        run: npm run build:web

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
