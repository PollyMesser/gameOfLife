[package]
name = "life-engine-wasm"
version = "0.1.0"
edition = "2021"
description = "WebAssembly-Anbindung der life-engine fuer die Browser-Version"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# ohne rayon: im Browser gibt es keine Threads
life-engine = { path = "../engine", default-features = false }
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
serde = { version = "1", features = ["derive"] }
